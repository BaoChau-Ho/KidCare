name: CI

# Mỗi Pull Request vào develop/main tự chạy: định dạng, lint, test, build.
# Các job backend/frontend tự bỏ qua bước nếu chưa có package.json
# (lúc B và D chưa tạo dự án), nên CI vẫn xanh ở tuần 1–2.

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Kiểm tra định dạng (Prettier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run format:check

  compose:
    name: Kiểm tra docker-compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet

  backend:
    name: Backend (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: kidcare_test
          POSTGRES_USER: kidcare
          POSTGRES_PASSWORD: kidcare_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kidcare -d kidcare_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://kidcare:kidcare_ci@localhost:5432/kidcare_test
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci_access_secret
      JWT_REFRESH_SECRET: ci_refresh_secret
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 7d
    steps:
      - uses: actions/checkout@v4
      - name: Bỏ qua nếu chưa có backend/package.json
        if: ${{ hashFiles('backend/package.json') == '' }}
        run: echo "Chưa có backend/package.json, bỏ qua."
      - uses: actions/setup-node@v4
        if: ${{ hashFiles('backend/package.json') != '' }}
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Cài dependency
        if: ${{ hashFiles('backend/package.json') != '' }}
        run: npm ci
      - name: Lint
        if: ${{ hashFiles('backend/package.json') != '' }}
        run: npm run lint --if-present
      - name: Test
        if: ${{ hashFiles('backend/package.json') != '' }}
        run: npm test --if-present
      - name: Build
        if: ${{ hashFiles('backend/package.json') != '' }}
        run: npm run build --if-present

  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Bỏ qua nếu chưa có frontend/package.json
        if: ${{ hashFiles('frontend/package.json') == '' }}
        run: echo "Chưa có frontend/package.json, bỏ qua."
      - uses: actions/setup-node@v4
        if: ${{ hashFiles('frontend/package.json') != '' }}
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Cài dependency
        if: ${{ hashFiles('frontend/package.json') != '' }}
        run: npm ci
      - name: Lint
        if: ${{ hashFiles('frontend/package.json') != '' }}
        run: npm run lint --if-present
      - name: Test
        if: ${{ hashFiles('frontend/package.json') != '' }}
        run: npm test --if-present
      - name: Build
        if: ${{ hashFiles('frontend/package.json') != '' }}
        run: npm run build --if-present
