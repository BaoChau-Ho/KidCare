          content:
            application/json:
              schema: { $ref: '#/components/schemas/PickupRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /notifications:
    get:
      tags: [Notifications]
      operationId: listNotifications
      summary: Người dùng xem thông báo của mình
      parameters:
        - name: unreadOnly
          in: query
          schema: { type: boolean, default: false }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Danh sách thông báo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /notifications/unread-count:
    get:
      tags: [Notifications]
      operationId: getUnreadNotificationCount
      summary: Đếm thông báo chưa đọc của người dùng hiện tại
      responses:
        '200':
          description: Số thông báo chưa đọc
          content:
            application/json:
              schema:
                type: object
                properties:
                  unreadCount: { type: integer, minimum: 0 }
                required: [unreadCount]
        '401': { $ref: '#/components/responses/Unauthorized' }

  /notifications/{notificationId}/read:
    patch:
      tags: [Notifications]
      operationId: markNotificationRead
      summary: Đánh dấu thông báo của mình đã đọc
      parameters:
        - name: notificationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Thông báo đã đọc
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Notification' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /notifications/broadcast:
    post:
      tags: [Notifications]
      operationId: broadcastNotification
      summary: Giáo viên gửi thông báo cho lớp hoặc nhóm trẻ
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BroadcastNotificationRequest' }
      responses:
        '201':
          description: Thông báo đã tạo cho người nhận
          content:
            application/json:
              schema:
                type: object
                properties:
                  recipientCount: { type: integer, minimum: 0 }
                  notificationCount: { type: integer, minimum: 0 }
                required: [recipientCount, notificationCount]
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /reports/attendance:
    get:
      tags: [Reports]
      operationId: getAttendanceReport
      summary: Báo cáo điểm danh và chuyên cần
      parameters:
        - { $ref: '#/components/parameters/ClassIdQuery' }
        - { $ref: '#/components/parameters/FromDate' }
        - { $ref: '#/components/parameters/ToDate' }
      responses:
        '200':
          description: Số liệu điểm danh tổng hợp
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttendanceReport' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /reports/classes:
    get:
      tags: [Reports]
      operationId: getClassReport
      summary: Báo cáo tổng hợp theo lớp
      parameters:
        - { $ref: '#/components/parameters/FromDate' }
        - { $ref: '#/components/parameters/ToDate' }
      responses:
        '200':
          description: Số liệu theo lớp
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ClassReport' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /reports/health:
    get:
      tags: [Reports]
      operationId: getHealthReport
      summary: Báo cáo sức khỏe tổng hợp
      parameters:
        - { $ref: '#/components/parameters/ClassIdQuery' }
        - { $ref: '#/components/parameters/FromDate' }
        - { $ref: '#/components/parameters/ToDate' }
      responses:
        '200':
          description: Số liệu sức khỏe đã tổng hợp theo quyền
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthReport' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: refreshToken

  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ChildId:
      name: childId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ClassId:
      name: classId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ClassIdQuery:
      name: classId
      in: query
      schema: { type: string, format: uuid }
    SearchQuery:
      name: query
      in: query
      description: Tìm gần đúng theo tên/email phù hợp với resource
      schema: { type: string, maxLength: 100 }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    FromDate:
      name: from
      in: query
      required: true
      schema: { type: string, format: date }
    ToDate:
      name: to
      in: query
      required: true
      schema: { type: string, format: date }

  responses:
    BadRequest:
      description: Dữ liệu đầu vào không hợp lệ
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Unauthorized:
      description: Chưa đăng nhập hoặc token không hợp lệ
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Forbidden:
      description: Đã đăng nhập nhưng không đủ quyền/phạm vi dữ liệu
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    NotFound:
      description: Không tìm thấy tài nguyên
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Conflict:
      description: Xung đột trạng thái hoặc tài nguyên đã tồn tại
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    TooManyRequests:
      description: Vượt giới hạn request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    PayloadTooLarge:
      description: File vượt dung lượng cho phép
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    ServiceUnavailable:
      description: Backend hoặc database chưa sẵn sàng
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }

  schemas:
    UserRole:
      type: string
      enum: [ADMIN, MANAGER, TEACHER, MEDICAL_STAFF, PARENT]
    UserStatus:
      type: string
      enum: [ACTIVE, LOCKED, INACTIVE]
    RegistrationRequestStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED, COMPLETED]
    ChildStatus:
      type: string
      enum: [ACTIVE, INACTIVE, WITHDRAWN]
    ClassStatus:
      type: string
      enum: [ACTIVE, CLOSED]
    AttendanceStatus:
      type: string
      enum: [PRESENT, ABSENT, LATE, EARLY_LEAVE]
    LeaveRequestStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED, CANCELLED]
    PickupStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED, COMPLETED, CANCELLED]
    Relationship:
      type: string
      enum: [FATHER, MOTHER, GUARDIAN]

    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        fullName: { type: string }
        phone: { type: [string, 'null'] }
        role: { $ref: '#/components/schemas/UserRole' }
        status: { $ref: '#/components/schemas/UserStatus' }
        createdAt: { type: string, format: date-time }
      required: [id, email, fullName, role, status, createdAt]

    AuditLog:
      type: object
      properties:
        id: { type: string, format: uuid }
        actorUserId: { type: [string, 'null'], format: uuid }
        actorName: { type: [string, 'null'] }
        action: { type: string }
        resourceType: { type: string }
        resourceId: { type: string, format: uuid }
        oldValue:
          type: [object, 'null']
          additionalProperties: true
          description: Đã loại bỏ password, token và trường nhạy cảm.
        newValue:
          type: [object, 'null']
          additionalProperties: true
          description: Đã loại bỏ password, token và trường nhạy cảm.
        ipAddress: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
      required: [id, action, resourceType, resourceId, createdAt]

    AuditLogPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AuditLog' }
        pageInfo: { $ref: '#/components/schemas/PageInfo' }
      required: [items, pageInfo]

    RegistrationRequest:
      type: object
      properties:
        id: { type: string, format: uuid }
        fullName: { type: string }
        email: { type: string, format: email }
        phone: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/RegistrationRequestStatus' }
        rejectionReason: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
      required: [id, fullName, email, status, createdAt]

    RegistrationRequestCreated:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/RegistrationRequestStatus' }
      required: [id, status]

    RegistrationApprovalResponse:
      type: object
      description: Liên kết thiết lập mật khẩu chỉ trả trong môi trường local.
      properties:
        id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/RegistrationRequestStatus' }
        setupPasswordUrl: { type: string, format: uri }
      required: [id, status, setupPasswordUrl]

    RejectRegistrationRequest:
      type: object
      properties:
        reason: { type: string, maxLength: 500 }

    RegistrationRequestPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/RegistrationRequest' }
        page: { $ref: '#/components/schemas/PageInfo' }
      required: [items, page]

    RegisterRequest:
      type: object
      properties:
        fullName: { type: string, minLength: 1, maxLength: 100 }
        email: { type: string, format: email, maxLength: 254 }
        phone: { type: string, maxLength: 20 }
      required: [fullName, email]

    SetPasswordRequest:
      type: object
      properties:
        setupToken: { type: string, minLength: 20 }
        password: { type: string, format: password, minLength: 8, maxLength: 128 }
        confirmPassword: { type: string, format: password, minLength: 8, maxLength: 128 }
      required: [setupToken, password, confirmPassword]

    LoginRequest:
      type: object
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
      required: [email, password]

    AuthResponse:
      type: object
      properties:
        accessToken: { type: string }
        tokenType: { type: string, const: Bearer }
        expiresIn: { type: integer, description: Thời hạn access token tính bằng giây }
        user: { $ref: '#/components/schemas/User' }
      required: [accessToken, tokenType, expiresIn, user]

    AccessTokenResponse:
      type: object
      properties:
        accessToken: { type: string }
        tokenType: { type: string, const: Bearer }
        expiresIn: { type: integer }
      required: [accessToken, tokenType, expiresIn]

    ChangePasswordRequest:
      type: object
      properties:
        currentPassword: { type: string, format: password }
        newPassword: { type: string, format: password, minLength: 8, maxLength: 128 }
      required: [currentPassword, newPassword]

    CreateUserRequest:
      type: object
      properties:
        fullName: { type: string, minLength: 1, maxLength: 100 }
        email: { type: string, format: email }
        phone: { type: string, maxLength: 20 }
        temporaryPassword: { type: string, format: password, minLength: 8, maxLength: 128 }
        role: { $ref: '#/components/schemas/UserRole' }
      required: [fullName, email, temporaryPassword, role]

    UpdateUserRequest:
      type: object
      properties:
        fullName: { type: string, minLength: 1, maxLength: 100 }
        phone: { type: [string, 'null'], maxLength: 20 }

    UpdateProfileRequest:
      type: object
      properties:
        fullName: { type: string, minLength: 1, maxLength: 100 }
        phone: { type: [string, 'null'], maxLength: 20 }

    PageInfo:
      type: object
      properties:
        page: { type: integer, minimum: 1 }
        limit: { type: integer, minimum: 1 }
        totalItems: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }
      required: [page, limit, totalItems, totalPages]

    UserPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/User' }
        pageInfo: { $ref: '#/components/schemas/PageInfo' }
      required: [items, pageInfo]

    Classroom:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        academicYear: { type: string }
        status: { $ref: '#/components/schemas/ClassStatus' }
        teacherUserIds:
          type: array
          items: { type: string, format: uuid }
        teachers:
          type: array
          description: Hồ sơ tóm tắt giáo viên đang được phân công.
          items: { $ref: '#/components/schemas/TeacherSummary' }
        childCount: { type: integer, minimum: 0 }
      required: [id, name, academicYear, status, teachers, childCount]

    TeacherSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        fullName: { type: string }
        email: { type: string, format: email }
      required: [id, fullName]

    CreateClassRequest:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        academicYear: { type: string, minLength: 4, maxLength: 20 }
      required: [name, academicYear]

    UpdateClassRequest:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        academicYear: { type: string, minLength: 4, maxLength: 20 }
        status: { $ref: '#/components/schemas/ClassStatus' }

    ClassTeacherAssignment:
      type: object
      properties:
        classId: { type: string, format: uuid }
        teacherUserId: { type: string, format: uuid }
      required: [classId, teacherUserId]

    ClassPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Classroom' }
        pageInfo: { $ref: '#/components/schemas/PageInfo' }
      required: [items, pageInfo]

    Child:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        dateOfBirth: { type: string, format: date }
        gender: { type: string, enum: [MALE, FEMALE, OTHER] }
        address: { type: [string, 'null'] }
        avatarUrl: { type: [string, 'null'], format: uri }
        classId: { type: string, format: uuid }
        className: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/ChildStatus' }
        parentUserIds:
          deprecated: true
          description: Chỉ giữ để tương thích client cũ; dùng parents để hiển thị tên và quan hệ.
          type: array
          items: { type: string, format: uuid }
        parents:
          type: array
          description: Tài khoản phụ huynh liên kết, kèm quan hệ và tên hiển thị.
          items: { $ref: '#/components/schemas/ChildParentSummary' }
      required: [id, name, dateOfBirth, gender, status, className, parents]

    ChildParentSummary:
      type: object
      properties:
        parentUserId: { type: string, format: uuid }
        fullName: { type: string }
        relationship: { $ref: '#/components/schemas/Relationship' }
      required: [parentUserId, fullName, relationship]

    CreateChildRequest:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 150 }
        dateOfBirth: { type: string, format: date }
        gender: { type: string, enum: [MALE, FEMALE, OTHER] }
        address: { type: string, maxLength: 500 }
        avatarUrl: { type: string, format: uri, maxLength: 2048 }
        classId: { type: string, format: uuid }
      required: [name, dateOfBirth, gender, classId]

    UpdateChildRequest:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 150 }
        dateOfBirth: { type: string, format: date }
        gender: { type: string, enum: [MALE, FEMALE, OTHER] }
        address: { type: [string, 'null'], maxLength: 500 }
        avatarUrl: { type: [string, 'null'], format: uri, maxLength: 2048 }
        classId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/ChildStatus' }

    LinkParentRequest:
      type: object
      properties:
        parentUserId: { type: string, format: uuid }
        relationship: { $ref: '#/components/schemas/Relationship' }
      required: [parentUserId, relationship]

    ChildParentLink:
      type: object
      properties:
        childId: { type: string, format: uuid }
        parentUserId: { type: string, format: uuid }
        relationship: { $ref: '#/components/schemas/Relationship' }
      required: [childId, parentUserId, relationship]

    ChildPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Child' }
        pageInfo: { $ref: '#/components/schemas/PageInfo' }
      required: [items, pageInfo]

    Attendance:
      type: object
      properties:
        id: { type: string, format: uuid }
        childId: { type: string, format: uuid }
        date: { type: string, format: date }
        checkInTime: { type: [string, 'null'], format: date-time }
        checkOutTime: { type: [string, 'null'], format: date-time }
        status: { $ref: '#/components/schemas/AttendanceStatus' }
        recordedByUserId: { type: string, format: uuid }
      required: [id, childId, date, status, recordedByUserId]

    UpdateAttendanceRequest:
      type: object
      properties:
        status: { $ref: '#/components/schemas/AttendanceStatus' }
        checkInTime: { type: [string, 'null'], format: date-time }
        checkOutTime: { type: [string, 'null'], format: date-time }

    AttendancePage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Attendance' }
        pageInfo: { $ref: '#/components/schemas/PageInfo' }
      required: [items, pageInfo]

    CreateLeaveRequest:
      type: object
      properties:
        childId: { type: string, format: uuid }
        fromDate: { type: string, format: date }
        toDate: { type: string, format: date }
        reason: { type: string, minLength: 1, maxLength: 1000 }
      required: [childId, fromDate, toDate, reason]

    LeaveRequest:
      type: object
      properties:
        id: { type: string, format: uuid }
        childId: { type: string, format: uuid }
        parentUserId: { type: string, format: uuid }
        fromDate: { type: string, format: date }
        toDate: { type: string, format: date }
        reason: { type: string }
        status: { $ref: '#/components/schemas/LeaveRequestStatus' }
      required: [id, childId, parentUserId, fromDate, toDate, reason, status]

    LeaveRequestPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/LeaveRequest' }
        pageInfo: { $ref: '#/components/schemas/PageInfo' }
      required: [items, pageInfo]

    CreateHealthRecordRequest:
      type: object
      properties:
        height: { type: number, format: float, exclusiveMinimum: 0 }
        weight: { type: number, format: float, exclusiveMinimum: 0 }
        temperature: { type: number, format: float, exclusiveMinimum: 0 }
        note: { type: string, maxLength: 2000 }

    UpdateHealthRecordRequest:
      $ref: '#/components/schemas/CreateHealthRecordRequest'

    HealthRecord:
      type: object
      properties:
        id: { type: string, format: uuid }
        childId: { type: string, format: uuid }
        height: { type: [number, 'null'], format: float }
        weight: { type: [number, 'null'], format: float }
        temperature: { type: [number, 'null'], format: float }
        note: { type: [string, 'null'] }
        recordedAt: { type: string, format: date-time }
      required: [id, childId, recordedAt]

    HealthRecordPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/HealthRecord' }
        pageInfo: { $ref: '#/components/schemas/PageInfo' }
      required: [items, pageInfo]

    HealthSummary:
      type: object
      properties:
        childId: { type: string, format: uuid }
        latestRecord: { oneOf: [{ $ref: '#/components/schemas/HealthRecord' }, { type: 'null' }] }
        allergies:
          type: array
          items: { $ref: '#/components/schemas/Allergy' }
        medicalConditions:
          type: array
          items: { $ref: '#/components/schemas/MedicalCondition' }
      required: [childId, allergies, medicalConditions]

    Allergy:
      type: object
      properties:
        id: { type: string, format: uuid }
        allergen: { type: string }
        severity: { type: string }
      required: [id, allergen, severity]

    MedicalCondition:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        note: { type: [string, 'null'] }
      required: [id, name]

    CreateVaccinationRequest:
      type: object
      properties:
        vaccineName: { type: string, minLength: 1 }
        doseNumber: { type: integer, minimum: 1 }
        vaccinatedAt: { type: string, format: date }
      required: [vaccineName, doseNumber, vaccinatedAt]

    Vaccination:
      allOf:
        - $ref: '#/components/schemas/CreateVaccinationRequest'
        - type: object
          properties:
            id: { type: string, format: uuid }
            childId: { type: string, format: uuid }
          required: [id, childId]

    CreateMedicalVisitRequest:
      type: object
      properties:
        visitedAt: { type: string, format: date-time }
        symptoms: { type: string, maxLength: 2000 }
        conclusion: { type: string, maxLength: 2000 }
        medications:
          type: array
          items: { $ref: '#/components/schemas/MedicationInput' }
      required: [visitedAt]

    MedicationInput:
      type: object
      properties:
        name: { type: string }
        dosage: { type: string }
        schedule: { type: string }
      required: [name, dosage, schedule]

    MedicalVisit:
      type: object
      properties:
        id: { type: string, format: uuid }
        childId: { type: string, format: uuid }
        visitedAt: { type: string, format: date-time }
        symptoms: { type: [string, 'null'] }
        conclusion: { type: [string, 'null'] }
        medications:
          type: array
          items: { $ref: '#/components/schemas/MedicationInput' }
      required: [id, childId, visitedAt, medications]

    HealthAlert:
      type: object
      properties:
        childId: { type: string, format: uuid }
        childName: { type: string }
        allergen: { type: string }
        severity: { type: string }
      required: [childId, childName, allergen]

    CreateActivityRequest:
      type: object
      properties:
        classId: { type: string, format: uuid }
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 5000 }
        date: { type: string, format: date }
        participants:
          type: array
          items: { $ref: '#/components/schemas/ActivityParticipantInput' }
      required: [classId, title, date]

    ActivityParticipantInput:
      type: object
      properties:
        childId: { type: string, format: uuid }
        participationStatus:
          type: string
          enum: [JOINED, NOT_JOINED]
      required: [childId, participationStatus]

    ActivityParticipant:
      allOf:
        - $ref: '#/components/schemas/ActivityParticipantInput'
        - type: object
          properties:
            activityId: { type: string, format: uuid }
          required: [activityId]

    Activity:
      type: object
      properties:
        id: { type: string, format: uuid }
        classId: { type: string, format: uuid }
        createdByTeacherUserId: { type: string, format: uuid }
        title: { type: string }
        description: { type: [string, 'null'] }
        date: { type: string, format: date }
        participants:
          type: array
          items: { $ref: '#/components/schemas/ActivityParticipant' }
        images:
          type: array
          items: { $ref: '#/components/schemas/ActivityImage' }
      required: [id, classId, title, date]

    ActivityImage:
      type: object
      properties:
        id: { type: string, format: uuid }
        objectKey: { type: string }
        url: { type: string, format: uri }
      required: [id, objectKey, url]

    ActivityPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Activity' }
        pageInfo: { $ref: '#/components/schemas/PageInfo' }
      required: [items, pageInfo]

    CreatePickupRequest:
      type: object
      properties:
        childId: { type: string, format: uuid }
        pickupPerson: { type: string, minLength: 1, maxLength: 150 }
        relationship: { type: string, maxLength: 50 }
        idNumber: { type: string, maxLength: 50 }
        phone: { type: string, maxLength: 30 }
        expectedTime: { type: string, format: date-time }
      required: [childId, pickupPerson, relationship, expectedTime]

    PickupRequest:
      type: object
      properties:
        id: { type: string, format: uuid }
        childId: { type: string, format: uuid }
        pickupPerson: { type: string }
        relationship: { type: string }
        expectedTime: { type: string, format: date-time }
        status: { $ref: '#/components/schemas/PickupStatus' }
        verifiedByTeacherUserId: { type: [string, 'null'], format: uuid }
      required: [id, childId, pickupPerson, relationship, expectedTime, status]

    PickupRequestPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/PickupRequest' }
        pageInfo: { $ref: '#/components/schemas/PageInfo' }
      required: [items, pageInfo]

    Notification:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        content: { type: string }
        channel: { type: string, enum: [IN_APP, PUSH_NOTIFICATION, EMAIL, SMS] }
        isRead: { type: boolean }
        createdAt: { type: string, format: date-time }
      required: [id, title, content, channel, isRead, createdAt]

    NotificationPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Notification' }
        pageInfo: { $ref: '#/components/schemas/PageInfo' }
      required: [items, pageInfo]

    BroadcastNotificationRequest:
      type: object
      properties:
        classId: { type: string, format: uuid }
        childIds:
          type: array
          uniqueItems: true
          items: { type: string, format: uuid }
        title: { type: string, minLength: 1, maxLength: 200 }
        content: { type: string, minLength: 1, maxLength: 5000 }
      required: [title, content]
      oneOf:
        - required: [classId]
        - required: [childIds]

    AttendanceReport:
      type: object
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        totalChildren: { type: integer, minimum: 0 }
        presentCount: { type: integer, minimum: 0 }
        lateCount: { type: integer, minimum: 0 }
        earlyLeaveCount: { type: integer, minimum: 0 }
        attendanceRate: { type: number, minimum: 0, maximum: 1 }
      required: [from, to, totalChildren, presentCount, attendanceRate]

    ClassReport:
      type: object
      properties:
        classId: { type: string, format: uuid }
        className: { type: string }
        childCount: { type: integer, minimum: 0 }
        attendanceRate: { type: number, minimum: 0, maximum: 1 }
        activityCount: { type: integer, minimum: 0 }
      required: [classId, className]

    HealthReport:
      type: object
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        childrenWithAllergy: { type: integer, minimum: 0 }
        childrenWithCondition: { type: integer, minimum: 0 }
        vaccinationRate: { type: number, minimum: 0, maximum: 1 }
      required: [from, to]

    ApiError:
      type: object
      properties:
        statusCode: { type: integer }
        code: { type: string }
        message:
          oneOf:
            - { type: string }
            - type: array
              items: { type: string }
        timestamp: { type: string, format: date-time }
        path: { type: string }
      required: [statusCode, message]
