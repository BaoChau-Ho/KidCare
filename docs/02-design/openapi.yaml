      operationId: listMedicalVisits
      summary: Nhân viên y tế xem các lần khám (mới nhất trước)
      parameters:
        - { $ref: '#/components/parameters/ChildId' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Danh sách lần khám
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MedicalVisitPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Health Records]
      operationId: createMedicalVisit
      summary: Nhân viên y tế ghi nhận lần khám
      description: |
        Không gửi visitedAt thì server dùng thời điểm hiện tại; có gửi thì không được ở tương lai.
        Cần ít nhất một trong symptoms, conclusion. Mỗi thuốc phải đủ name, dosage, schedule.
      parameters:
        - { $ref: '#/components/parameters/ChildId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateMedicalVisitRequest' }
      responses:
        '201':
          description: Lần khám đã được ghi nhận
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MedicalVisit' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /classes/{classId}/health-alerts:
    get:
      tags: [Health Records]
      operationId: listClassHealthAlerts
      summary: Xem cảnh báo dị ứng và bệnh nền của lớp
      description: |
        TEACHER chỉ xem lớp mình phụ trách; MANAGER và MEDICAL_STAFF xem mọi lớp; PARENT, ADMIN: 403.
        Chỉ gồm trẻ ACTIVE, dị ứng và bệnh nền đang active. Không có ghi chú hay chẩn đoán.
      parameters:
        - { $ref: '#/components/parameters/ClassId' }
      responses:
        '200':
          description: Danh sách cảnh báo tối thiểu theo quyền
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/HealthAlert' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /activities:
    get:
      tags: [Activities]
      operationId: listActivities
      summary: Danh sách hoạt động theo lớp/ngày
      parameters:
        - name: classId
          in: query
          schema: { type: string, format: uuid }
        - name: date
          in: query
          schema: { type: string, format: date }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Danh sách hoạt động
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActivityPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Activities]
      operationId: createActivity
      summary: Giáo viên tạo hoạt động và chọn trẻ tham gia
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateActivityRequest' }
      responses:
        '201':
          description: Hoạt động đã tạo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Activity' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /activities/{activityId}/participants:
    post:
      tags: [Activities]
      operationId: addActivityParticipants
      summary: Ghi nhận trẻ tham gia hoạt động
      parameters:
        - name: activityId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                participants:
                  type: array
                  items: { $ref: '#/components/schemas/ActivityParticipantInput' }
              required: [participants]
      responses:
        '200':
          description: Danh sách người tham gia đã cập nhật
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ActivityParticipant' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /activities/{activityId}/images:
    post:
      tags: [Activities]
      operationId: uploadActivityImage
      summary: Tải ảnh hoạt động lên object storage
      parameters:
        - name: activityId
