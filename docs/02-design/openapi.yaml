openapi: 3.1.0
info:
  title: KidCare API
  version: 0.1.0
  description: |
    Hợp đồng API thiết kế theo roadmap và các use case UC-01 đến UC-15.
    Backend đã có API xác thực, đăng ký, quản lý người dùng, audit log, lớp và hồ sơ trẻ;
    các use case còn lại tiếp tục được triển khai theo roadmap.
    Cập nhật đặc tả cùng pull request khi thay đổi API.
servers:
  - url: http://localhost:3000
    description: Backend local
tags:
  - name: Health
  - name: Auth
  - name: Registration Requests
  - name: Users
  - name: Audit Logs
  - name: Children
  - name: Classes
  - name: Attendance
  - name: Leave Requests
  - name: Health Records
  - name: Activities
  - name: Pickup
  - name: Notifications
  - name: Reports
security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [Health]
      operationId: getLiveness
      summary: Kiểm tra backend còn hoạt động
      security: []
      responses:
        '200':
          description: Backend đang hoạt động
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: ok }
                  timestamp: { type: string, format: date-time }
                required: [status, timestamp]

  /health/ready:
    get:
      tags: [Health]
      operationId: getReadiness
      summary: Kiểm tra backend kết nối được database
      security: []
      responses:
        '200':
          description: Database sẵn sàng
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: ok }
                  database: { type: string, const: ok }
                required: [status, database]
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /auth/register:
    post:
      tags: [Auth]
      operationId: registerParent
      summary: Gửi yêu cầu đăng ký tài khoản
      description: Tạo yêu cầu ở trạng thái PENDING. Tài khoản chưa thể đăng nhập cho đến khi admin duyệt và người dùng thiết lập mật khẩu.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Yêu cầu đăng ký đã được ghi nhận
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegistrationRequestCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }

  /auth/me:
    get:
      tags: [Auth]
      operationId: getAuthenticatedUser
      summary: Lấy thông tin người dùng đang đăng nhập
      responses:
        '200':
          description: Thông tin tài khoản hiện tại
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/{id}/approve:
    parameters:
      - name: id
        in: path
        required: true
        description: ID yêu cầu đăng ký
        schema: { type: string, format: uuid }
    patch:
      tags: [Registration Requests]
      operationId: approveRegistrationRequest
      summary: Duyệt yêu cầu đăng ký (chỉ môi trường local)
      description: |-
        Endpoint hiện không có guard xác thực và chỉ được bật khi APP_ENV=local.
        Không triển khai endpoint mở này trong môi trường dùng chung hoặc production.
        Khi duyệt, hệ thống tạo liên kết thiết lập mật khẩu.
      security: []
      responses:
        '200':
          description: Đã duyệt yêu cầu và tạo liên kết thiết lập mật khẩu
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegistrationApprovalResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '403':
          description: Endpoint không được bật ngoài APP_ENV=local
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /admin/registration-requests:
    get:
      tags: [Registration Requests]
      operationId: listRegistrationRequests
      summary: Admin xem các yêu cầu đăng ký
      description: Chỉ ADMIN. Mặc định có thể lọc theo trạng thái PENDING và phân trang.
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/RegistrationRequestStatus' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Danh sách yêu cầu đăng ký
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegistrationRequestPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/registration-requests/{id}/reject:
    parameters:
      - name: id
        in: path
        required: true
        description: ID yêu cầu đăng ký
        schema: { type: string, format: uuid }
    patch:
      tags: [Registration Requests]
      operationId: rejectRegistrationRequest
      summary: Admin từ chối yêu cầu đăng ký
      description: Chỉ ADMIN.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RejectRegistrationRequest' }
      responses:
        '200':
          description: Yêu cầu đã bị từ chối
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegistrationRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Đăng nhập bằng email và mật khẩu
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Đăng nhập thành công; refresh token được gửi bằng cookie HttpOnly
          headers:
            Set-Cookie:
              description: Cookie refreshToken; cấu hình Secure khi chạy HTTPS
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/set-password:
    post:
      tags: [Auth]
      operationId: setPasswordFromRegistrationLink
      summary: Thiết lập mật khẩu từ liên kết được admin gửi
      description: Endpoint công khai; yêu cầu token thiết lập mật khẩu hợp lệ, chỉ dùng một lần và có thời hạn.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetPasswordRequest' }
      responses:
        '204': { description: Mật khẩu đã được thiết lập; tài khoản có thể đăng nhập }
        '400': { $ref: '#/components/responses/BadRequest' }
        '410':
          description: Liên kết thiết lập mật khẩu đã hết hạn hoặc đã được sử dụng
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshAccessToken
      summary: Cấp access token mới bằng refresh token
      security:
        - refreshCookie: []
      responses:
        '200':
          description: Token mới
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessTokenResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Thu hồi phiên đăng nhập hiện tại
      security:
        - refreshCookie: []
      responses:
        '204':
          description: Đã thu hồi phiên và xóa cookie refresh token
          headers:
            Set-Cookie:
              description: Cookie refreshToken đã bị xóa
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/change-password:
    post:
      tags: [Auth]
      operationId: changePassword
      summary: Đổi mật khẩu của tài khoản đang đăng nhập
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '204': { description: Đã đổi mật khẩu }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /users/me:
    get:
      tags: [Users]
      operationId: getCurrentUser
      summary: Xem hồ sơ tài khoản hiện tại
      responses:
        '200':
          description: Hồ sơ tài khoản
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Users]
      operationId: updateCurrentUser
      summary: Cập nhật hồ sơ tài khoản hiện tại
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProfileRequest' }
      responses:
        '200':
          description: Hồ sơ đã cập nhật
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: Admin quản lý tài khoản hoặc Manager tra cứu phụ huynh/giáo viên
      description: |-
        ADMIN được xem danh sách tài khoản theo bộ lọc.
        MANAGER chỉ được tra cứu user ACTIVE với role=TEACHER hoặc role=PARENT để phục vụ UC-04/UC-05;
        request của MANAGER bắt buộc có role là TEACHER hoặc PARENT. MANAGER không được dùng endpoint này để xem role khác.
        Response không bao giờ chứa password hash, token hoặc thông tin xác thực.
      parameters:
        - { $ref: '#/components/parameters/SearchQuery' }
        - name: role
          in: query
          schema: { $ref: '#/components/schemas/UserRole' }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/UserStatus' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Danh sách tài khoản theo phạm vi của role gọi API
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Users]
      operationId: createUser
      summary: Admin tạo tài khoản
      description: Mật khẩu tạm được băm trước khi lưu và không xuất hiện trong response.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUserRequest' }
      responses:
        '201':
          description: Tài khoản đã tạo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /users/{userId}:
    parameters:
      - { $ref: '#/components/parameters/UserId' }
    patch:
      tags: [Users]
      operationId: updateUser
      summary: Admin sửa thông tin tài khoản
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateUserRequest' }
      responses:
        '200':
          description: Tài khoản đã cập nhật
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /users/{userId}/role:
    parameters:
      - { $ref: '#/components/parameters/UserId' }
    patch:
      tags: [Users]
      operationId: changeUserRole
      summary: Admin đổi vai trò tài khoản
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role: { $ref: '#/components/schemas/UserRole' }
              required: [role]
      responses:
        '200':
          description: Vai trò đã đổi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /users/{userId}/status:
    parameters:
      - { $ref: '#/components/parameters/UserId' }
    patch:
      tags: [Users]
      operationId: changeUserStatus
      summary: Admin khóa hoặc mở khóa tài khoản
      description: Không cho Admin tự khóa tài khoản đang dùng.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { $ref: '#/components/schemas/UserStatus' }
              required: [status]
      responses:
        '200':
          description: Trạng thái đã đổi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /audit-logs:
    get:
      tags: [Audit Logs]
      operationId: listAuditLogs
      summary: Admin tra cứu nhật ký thao tác quản trị
      description: Chỉ ADMIN. Không ghi/trả password, token hoặc dữ liệu bí mật; oldValue/newValue phải được lọc dữ liệu nhạy cảm.
      parameters:
        - name: actorUserId
          in: query
          schema: { type: string, format: uuid }
        - name: action
          in: query
          schema: { type: string, maxLength: 100 }
        - name: resourceType
          in: query
          schema: { type: string, maxLength: 100 }
        - name: resourceId
          in: query
          schema: { type: string, format: uuid }
        - { $ref: '#/components/parameters/FromDate' }
        - { $ref: '#/components/parameters/ToDate' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Nhật ký mới nhất, có phân trang
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditLogPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /children:
    get:
      tags: [Children]
      operationId: listChildren
      summary: Tìm và lọc hồ sơ trẻ
      parameters:
        - { $ref: '#/components/parameters/SearchQuery' }
        - name: classId
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ChildStatus' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Danh sách trẻ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChildPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Children]
      operationId: createChild
      summary: Tạo hồ sơ trẻ
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateChildRequest' }
      responses:
        '201':
          description: Hồ sơ trẻ đã tạo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Child' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /children/{childId}:
    parameters:
      - { $ref: '#/components/parameters/ChildId' }
    get:
      tags: [Children]
      operationId: getChild
      summary: Xem hồ sơ trẻ
      responses:
        '200':
          description: Hồ sơ trẻ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Child' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Children]
      operationId: updateChild
      summary: Cập nhật hồ sơ hoặc chuyển lớp
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateChildRequest' }
      responses:
        '200':
          description: Hồ sơ đã cập nhật
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Child' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /children/{childId}/parents:
    parameters:
      - { $ref: '#/components/parameters/ChildId' }
    post:
      tags: [Children]
      operationId: linkParentToChild
      summary: Liên kết tài khoản phụ huynh với trẻ
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LinkParentRequest' }
      responses:
        '201':
          description: Liên kết đã tạo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChildParentLink' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /classes:
    get:
      tags: [Classes]
      operationId: listClasses
      summary: Danh sách lớp theo năm học/trạng thái
      parameters:
        - name: academicYear
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ClassStatus' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Danh sách lớp
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClassPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Classes]
      operationId: createClass
      summary: Tạo lớp
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateClassRequest' }
      responses:
        '201':
          description: Lớp đã tạo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Classroom' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /classes/{classId}:
    parameters:
      - { $ref: '#/components/parameters/ClassId' }
    get:
      tags: [Classes]
      operationId: getClass
      summary: Xem lớp
      responses:
        '200':
          description: Thông tin lớp
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Classroom' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Classes]
      operationId: updateClass
      summary: Sửa lớp hoặc đóng lớp
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateClassRequest' }
      responses:
        '200':
          description: Lớp đã cập nhật
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Classroom' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /classes/{classId}/teachers:
    parameters:
      - { $ref: '#/components/parameters/ClassId' }
    post:
      tags: [Classes]
      operationId: assignTeachers
      summary: Phân công một hoặc nhiều giáo viên vào lớp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                teacherUserIds:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items: { type: string, format: uuid }
              required: [teacherUserIds]
      responses:
        '200':
          description: Danh sách phân công hiện tại
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ClassTeacherAssignment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /classes/{classId}/teachers/{teacherUserId}:
    delete:
      tags: [Classes]
      operationId: removeTeacherFromClass
      summary: Gỡ giáo viên khỏi lớp
      parameters:
