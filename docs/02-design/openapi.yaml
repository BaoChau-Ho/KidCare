        classId: { type: string, format: uuid }
        className: { type: string }
        childCount: { type: integer, minimum: 0 }
        attendanceRate: { type: number, minimum: 0, maximum: 1 }
        activityCount: { type: integer, minimum: 0 }
      required: [classId, className]

    HealthReport:
      type: object
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        childrenWithAllergy: { type: integer, minimum: 0 }
        childrenWithCondition: { type: integer, minimum: 0 }
        vaccinationRate: { type: number, minimum: 0, maximum: 1 }
      required: [from, to]

    ApiError:
      type: object
      properties:
        statusCode: { type: integer }
        code: { type: string }
        message:
          oneOf:
            - { type: string }
            - type: array
              items: { type: string }
        timestamp: { type: string, format: date-time }
        path: { type: string }
      required: [statusCode, message]
