  /children/{childId}/health-summary:
    get:
      tags: [Health Records]
      operationId: getChildHealthSummary
      summary: Xem tóm tắt sức khỏe đã lọc theo vai trò
      description: |
        Chỉ gồm dị ứng và bệnh nền đang active. visits tối đa 10 lần khám gần nhất.
        upcomingVaccinations gồm các mũi có nextDueDate từ nay đến hôm nay + 30 ngày, kể cả mũi đã quá hạn.
        - MEDICAL_STAFF: view FULL, đầy đủ mọi trường.
        - PARENT (trẻ đã liên kết): view PARENT. latestRecord không có note; dị ứng chỉ có id, allergen, severity;
          bệnh nền chỉ có id, name; lần khám không có conclusion.
        - TEACHER (lớp phụ trách): view ALERT_ONLY. latestRecord = null; vaccinations, upcomingVaccinations, visits rỗng;
          dị ứng và bệnh nền rút gọn như PARENT.
        - MANAGER, ADMIN: 403.
      parameters:
        - { $ref: '#/components/parameters/ChildId' }
      responses:
        '200':
          description: Tóm tắt sức khỏe phù hợp quyền truy cập
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

