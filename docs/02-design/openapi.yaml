  # ---------- UC-09 Hồ sơ sức khỏe (Stage 4) ----------
  # Đơn vị: chiều cao cm, cân nặng kg, nhiệt độ °C.
  # Khoảng hợp lệ, tính cả hai đầu: chiều cao 30-150, cân nặng 2-50, nhiệt độ 34-42. Ngoài khoảng trả 400.
  # Cảnh báo: abnormal chứa TEMPERATURE khi nhiệt độ >= 37.5 (sốt) hoặc <= 35 (thân nhiệt thấp).
  # Quyền: chỉ MEDICAL_STAFF đọc và ghi dữ liệu chi tiết (số đo, dị ứng, bệnh nền, tiêm chủng, lần khám).
  # PARENT (trẻ đã liên kết) và TEACHER (lớp mình phụ trách) chỉ đọc health-summary, đã lọc theo vai trò.
  # Sai vai trò hoặc ngoài phạm vi: 403. Trẻ hoặc bản ghi không tồn tại: 404.
  # Audit ghi lại mọi lần tạo/sửa nhưng không ghi nội dung ghi chú, triệu chứng, kết luận.
  /children/{childId}/health-records:
    get:
      tags: [Health Records]
      operationId: listChildHealthRecords
      summary: Nhân viên y tế xem lịch sử số đo (mới nhất trước)
      parameters:
        - { $ref: '#/components/parameters/ChildId' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Lịch sử số đo, sắp xếp recordedAt giảm dần
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthRecordPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Health Records]
      operationId: createChildHealthRecord
      summary: Nhân viên y tế ghi số đo sức khỏe
      description: Cần ít nhất một trong ba chỉ số. recordedAt do server đặt bằng thời điểm ghi.
      parameters:
        - { $ref: '#/components/parameters/ChildId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateHealthRecordRequest' }
      responses:
        '201':
          description: Số đo đã được ghi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthRecord' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /health-records/{recordId}:
    patch:
      tags: [Health Records]
      operationId: updateHealthRecord
      summary: Nhân viên y tế sửa số đo
      description: Gửi null để xóa một chỉ số. Sau khi sửa vẫn phải còn ít nhất một chỉ số, nếu không trả 400.
      parameters:
