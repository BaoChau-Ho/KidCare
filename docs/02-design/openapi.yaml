          schema: { type: string, format: uuid }
        - name: date
          in: query
          schema: { type: string, format: date }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/PickupStatus' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Danh sách yêu cầu đón
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PickupRequestPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Pickup]
      operationId: createPickupRequest
      summary: Phụ huynh đăng ký người đón trẻ
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePickupRequest' }
      responses:
        '201':
          description: Yêu cầu được tạo với trạng thái PENDING
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PickupRequest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /pickup-requests/{requestId}/cancel:
    patch:
      tags: [Pickup]
      operationId: cancelPickupRequest
      summary: Phụ huynh hủy yêu cầu còn PENDING
      parameters:
        - name: requestId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Yêu cầu đã hủy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PickupRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /pickup-requests/{requestId}/approve:
    patch:
      tags: [Pickup]
      operationId: approvePickupRequest
      summary: Giáo viên duyệt yêu cầu đón
      parameters:
        - name: requestId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Yêu cầu đã duyệt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PickupRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /pickup-requests/{requestId}/reject:
    patch:
      tags: [Pickup]
      operationId: rejectPickupRequest
      summary: Giáo viên từ chối yêu cầu đón
      parameters:
        - name: requestId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, minLength: 1 }
              required: [reason]
      responses:
        '200':
          description: Yêu cầu đã từ chối
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PickupRequest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /pickup-requests/{requestId}/complete:
    patch:
      tags: [Pickup]
      operationId: completePickupRequest
      summary: Xác nhận đã giao trẻ và hoàn tất check-out
      parameters:
        - name: requestId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Yêu cầu hoàn tất
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PickupRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /notifications:
    get:
      tags: [Notifications]
      operationId: listNotifications
      summary: Người dùng xem thông báo của mình
      parameters:
        - name: unreadOnly
          in: query
          schema: { type: boolean, default: false }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Danh sách thông báo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /notifications/unread-count:
    get:
      tags: [Notifications]
      operationId: getUnreadNotificationCount
      summary: Đếm thông báo chưa đọc của người dùng hiện tại
      responses:
        '200':
          description: Số thông báo chưa đọc
          content:
            application/json:
              schema:
                type: object
                properties:
                  unreadCount: { type: integer, minimum: 0 }
                required: [unreadCount]
        '401': { $ref: '#/components/responses/Unauthorized' }

  /notifications/{notificationId}/read:
    patch:
      tags: [Notifications]
      operationId: markNotificationRead
      summary: Đánh dấu thông báo của mình đã đọc
      parameters:
        - name: notificationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Thông báo đã đọc
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Notification' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /notifications/broadcast:
    post:
      tags: [Notifications]
      operationId: broadcastNotification
      summary: Giáo viên gửi thông báo cho lớp hoặc nhóm trẻ
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BroadcastNotificationRequest' }
      responses:
        '201':
          description: Thông báo đã tạo cho người nhận
          content:
            application/json:
              schema:
                type: object
                properties:
                  recipientCount: { type: integer, minimum: 0 }
                  notificationCount: { type: integer, minimum: 0 }
                required: [recipientCount, notificationCount]
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /reports/attendance:
    get:
      tags: [Reports]
      operationId: getAttendanceReport
      summary: Báo cáo điểm danh và chuyên cần
      parameters:
        - { $ref: '#/components/parameters/ClassIdQuery' }
        - { $ref: '#/components/parameters/FromDate' }
        - { $ref: '#/components/parameters/ToDate' }
      responses:
        '200':
          description: Số liệu điểm danh tổng hợp
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttendanceReport' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /reports/classes:
    get:
      tags: [Reports]
      operationId: getClassReport
      summary: Báo cáo tổng hợp theo lớp
      parameters:
        - { $ref: '#/components/parameters/FromDate' }
        - { $ref: '#/components/parameters/ToDate' }
      responses:
        '200':
          description: Số liệu theo lớp
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ClassReport' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /reports/health:
    get:
      tags: [Reports]
      operationId: getHealthReport
      summary: Báo cáo sức khỏe tổng hợp
      parameters:
        - { $ref: '#/components/parameters/ClassIdQuery' }
        - { $ref: '#/components/parameters/FromDate' }
        - { $ref: '#/components/parameters/ToDate' }
      responses:
        '200':
          description: Số liệu sức khỏe đã tổng hợp theo quyền
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthReport' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: refreshToken

  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ChildId:
      name: childId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ClassId:
      name: classId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ClassIdQuery:
      name: classId
      in: query
      schema: { type: string, format: uuid }
    SearchQuery:
      name: query
      in: query
      description: Tìm gần đúng theo tên/email phù hợp với resource
      schema: { type: string, maxLength: 100 }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    FromDate:
      name: from
      in: query
      required: true
      schema: { type: string, format: date }
    ToDate:
      name: to
      in: query
      required: true
      schema: { type: string, format: date }

  responses:
    BadRequest:
      description: Dữ liệu đầu vào không hợp lệ
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Unauthorized:
      description: Chưa đăng nhập hoặc token không hợp lệ
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Forbidden:
      description: Đã đăng nhập nhưng không đủ quyền/phạm vi dữ liệu
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    NotFound:
      description: Không tìm thấy tài nguyên
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Conflict:
      description: Xung đột trạng thái hoặc tài nguyên đã tồn tại
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    TooManyRequests:
      description: Vượt giới hạn request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    PayloadTooLarge:
      description: File vượt dung lượng cho phép
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    ServiceUnavailable:
      description: Backend hoặc database chưa sẵn sàng
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }

  schemas:
    UserRole:
      type: string
      enum: [ADMIN, MANAGER, TEACHER, MEDICAL_STAFF, PARENT]
    UserStatus:
      type: string
      enum: [ACTIVE, LOCKED, INACTIVE]
    RegistrationRequestStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED, COMPLETED]
    ChildStatus:
      type: string
      enum: [ACTIVE, INACTIVE, WITHDRAWN]
    ClassStatus:
      type: string
      enum: [ACTIVE, CLOSED]
    AttendanceStatus:
      type: string
      enum: [PRESENT, ABSENT, LATE, EARLY_LEAVE]
    LeaveRequestStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED, CANCELLED]
    PickupStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED, COMPLETED, CANCELLED]
    Relationship:
      type: string
      enum: [FATHER, MOTHER, GUARDIAN]

    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        fullName: { type: string }
        phone: { type: [string, 'null'] }
        role: { $ref: '#/components/schemas/UserRole' }
        status: { $ref: '#/components/schemas/UserStatus' }
        createdAt: { type: string, format: date-time }
      required: [id, email, fullName, role, status, createdAt]

    AuditLog:
      type: object
      properties:
        id: { type: string, format: uuid }
        actorUserId: { type: [string, 'null'], format: uuid }
        actorName: { type: [string, 'null'] }
        action: { type: string }
        resourceType: { type: string }
        resourceId: { type: string, format: uuid }
        oldValue:
          type: [object, 'null']
          additionalProperties: true
          description: Đã loại bỏ password, token và trường nhạy cảm.
        newValue:
          type: [object, 'null']
          additionalProperties: true
          description: Đã loại bỏ password, token và trường nhạy cảm.
        ipAddress: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
      required: [id, action, resourceType, resourceId, createdAt]

    AuditLogPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AuditLog' }
        pageInfo: { $ref: '#/components/schemas/PageInfo' }
      required: [items, pageInfo]

    RegistrationRequest:
      type: object
      properties:
        id: { type: string, format: uuid }
        fullName: { type: string }
        email: { type: string, format: email }
        phone: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/RegistrationRequestStatus' }
        rejectionReason: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
      required: [id, fullName, email, status, createdAt]

    RegistrationRequestCreated:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/RegistrationRequestStatus' }
      required: [id, status]

    RegistrationApprovalResponse:
      type: object
      description: Liên kết thiết lập mật khẩu chỉ trả trong môi trường local.
      properties:
        id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/RegistrationRequestStatus' }
        setupPasswordUrl: { type: string, format: uri }
      required: [id, status, setupPasswordUrl]

    RejectRegistrationRequest:
      type: object
      properties:
        reason: { type: string, maxLength: 500 }

    RegistrationRequestPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/RegistrationRequest' }
        page: { $ref: '#/components/schemas/PageInfo' }
      required: [items, page]

    RegisterRequest:
      type: object
      properties:
        fullName: { type: string, minLength: 1, maxLength: 100 }
        email: { type: string, format: email, maxLength: 254 }
        phone: { type: string, maxLength: 20 }
      required: [fullName, email]

    SetPasswordRequest:
      type: object
      properties:
        setupToken: { type: string, minLength: 20 }
        password: { type: string, format: password, minLength: 8, maxLength: 128 }
        confirmPassword: { type: string, format: password, minLength: 8, maxLength: 128 }
      required: [setupToken, password, confirmPassword]

    LoginRequest:
      type: object
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
      required: [email, password]

    AuthResponse:
      type: object
      properties:
        accessToken: { type: string }
        tokenType: { type: string, const: Bearer }
        expiresIn: { type: integer, description: Thời hạn access token tính bằng giây }
        user: { $ref: '#/components/schemas/User' }
